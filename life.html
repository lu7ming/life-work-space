<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#D4BA9F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="人生工作台">
  <title>人生工作台</title>

  <!-- 应用版本号（集中管理，升级时只需修改此处和 sw.js） -->
  <script>window.__APP_VERSION__ = 'v75';</script>
  <!-- PWA -->
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://api.deepseek.com">
  <link rel="preconnect" href="https://api.coze.cn">
  <link rel="preconnect" href="https://api.github.com">

  <!-- 样式 -->
  <link rel="stylesheet" href="styles/main.css?v=50">
  <link rel="stylesheet" href="styles/sidebar.css?v=50">
  <link rel="stylesheet" href="styles/dashboard.css?v=32">
  <link rel="stylesheet" href="styles/search.css?v=32">
  <link rel="stylesheet" href="styles/nicole.css?v=32">
  <link rel="stylesheet" href="styles/xiaolu.css?v=32">
  <link rel="stylesheet" href="styles/audit-log.css?v=47">
  <link rel="stylesheet" href="styles/quickinput.css?v=32">
  <link rel="stylesheet" href="modules/music/music.css?v=32">

  <!-- 防闪白：在页面渲染前立即应用主题 -->
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('life-workspace-theme');
        if (raw) {
          var t = JSON.parse(raw);
          if (t && t.value) {
            var theme = t.value;
            if (theme === 'auto') {
              theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'dark') {
              var meta = document.querySelector('meta[name="theme-color"]');
              if (meta) meta.setAttribute('content', '#1A1A2E');
            }
          }
        }
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="modules/rest/rest.css?v=32">
  <link rel="stylesheet" href="styles/templates.css?v=32">
  <link rel="stylesheet" href="modules/report/report.css?v=57">

  <!-- 版本号同步：将所有 stylesheet 的版本号参数同步为 __APP_VERSION__ -->
  <script>
    (function() {
      var v = window.__APP_VERSION__ || 'v75';
      document.querySelectorAll('link[rel="stylesheet"]').forEach(function(l) {
        l.href = l.href.replace(/\?v=\w+/, '') + '?v=' + v;
      });
    })();
  </script>
</head>
<body>

  <!-- 背景动效层（渐变背景 + Canvas 粒子动画） -->
  <div id="bg-effects-layer">
    <canvas id="bg-effects-canvas"></canvas>
  </div>

  <!-- 移动端侧边栏遮罩 -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- 应用容器 -->
  <div class="app-container">

    <!-- ========== 左侧边栏 ========== -->
    <aside class="sidebar" id="sidebar">
      <!-- 头像 -->
      <div class="sidebar-avatar">
        <div class="sidebar-avatar-img">
          <img src="assets/avatar.jpg" alt="头像">
        </div>
      </div>

      <!-- AI 每日金句 -->
      <div class="sidebar-quote">
        <p class="sidebar-quote-text">
          每一个优秀的人，都有一段沉默的时光。<br>
          那段时光，是付出了很多努力却得不到结果的日子。
        </p>
      </div>

      <!-- 打卡签到 -->
      <div class="sidebar-checkin">
        <button class="sidebar-checkin-btn" id="checkin-btn">打卡签到</button>
        <p class="sidebar-streak">连续坚持：<strong id="streak-count">0</strong> 天</p>
      </div>

      <!-- 分割线 -->
      <div class="sidebar-divider"></div>

      <!-- 导航菜单 -->
      <nav class="sidebar-nav">
        <div class="sidebar-nav-item active" data-route="dashboard">
          <span class="nav-icon">🏠</span>
          <span>今日总览</span>
        </div>
        <div class="sidebar-nav-item" data-route="habits">
          <span class="nav-icon">✅</span>
          <span>习惯打卡</span>
        </div>
        <div class="sidebar-nav-item" data-route="tasks">
          <span class="nav-icon">📋</span>
          <span>任务</span>
        </div>
        <div class="sidebar-nav-item" data-route="study">
          <span class="nav-icon">📚</span>
          <span>学习</span>
        </div>
        <div class="sidebar-nav-item" data-route="health">
          <span class="nav-icon">💪</span>
          <span>健康</span>
        </div>
        <div class="sidebar-nav-item" data-route="finance">
          <span class="nav-icon">💰</span>
          <span>财务</span>
        </div>
        <div class="sidebar-nav-item" data-route="goals">
          <span class="nav-icon">🎯</span>
          <span>目标</span>
        </div>

        <!-- 更多（展开子菜单） -->
        <div class="sidebar-nav-group">
          <div class="sidebar-nav-item" data-toggle="submenu">
            <span class="nav-icon">⋯</span>
            <span>更多</span>
            <span class="nav-arrow">›</span>
          </div>
          <div class="sidebar-submenu">
            <div class="sidebar-submenu-item" data-route="journal">📝 日记</div>
            <div class="sidebar-submenu-item" data-route="calendar">📅 日历</div>
            <div class="sidebar-submenu-item" data-route="content">🎬 创作日程</div>
            <div class="sidebar-submenu-item" data-route="templates">📊 复盘</div>
            <div class="sidebar-submenu-item" data-route="toolbox">🧰 工具箱</div>
          </div>
        </div>
      </nav>

      <!-- 底部 -->
      <div class="sidebar-footer">
        人生工作台 v1.0
      </div>
    </aside>

    <!-- ========== 主区域 ========== -->
    <div class="main-area">

      <!-- 顶部栏 -->
      <header class="topbar">
        <div class="topbar-left">
          <!-- 移动端菜单按钮 -->
          <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
          <span class="topbar-date" id="topbar-date"></span>
          <!-- AI 按钮 - 已移至右下角FAB组 -->
          <!-- <div class="topbar-ai-btns">
            <button class="topbar-ai-btn" title="小鹿AI">🦌</button>
            <button class="topbar-ai-btn" title="妮可AI">💎</button>
          </div> -->
        </div>
        <div class="topbar-right">
          <!-- 通知铃铛 -->
          <button class="topbar-icon-btn topbar-notif-bell" id="notif-bell" title="通知中心">
            🔔
            <span class="topbar-notif-badge" id="notif-badge" style="display:none;">0</span>
          </button>
          <button class="topbar-rest-btn" id="rest-mode-btn" title="休息模式 - 魁北克雪夜">❄️</button>
          <button class="topbar-icon-btn" data-tip="🌳 生命树">🌳</button>
          <button class="topbar-icon-btn" id="topbar-audit-btn" title="📜 AI 操作历史">📜</button>
          <div style="position:relative;">
            <button class="topbar-icon-btn" id="topbar-more-btn">⋮</button>
            <div class="topbar-more-menu" id="topbar-more-menu">
              <button data-action="search">🔍 搜索</button>
              <button data-action="music">🎵 音乐</button>
              <button data-action="save">💾 保存</button>
              <button data-action="sync">☁️ 同步</button>
              <button data-action="export">📤 导出数据</button>
              <button data-action="import">📥 导入数据</button>
              <button data-action="refresh">🔄 刷新</button>
              <button data-action="theme">🎨 主题</button>
            </div>
          </div>
        </div>
      </header>

      <!-- 内容区 -->
      <main class="content-area" id="content-area">
        <!-- 页面内容由路由动态加载 -->
        <div style="text-align:center;padding:80px 20px;color:var(--text-muted);">
          加载中...
        </div>
      </main>

      <!-- 通知面板 -->
      <div class="notif-panel" id="notif-panel">
        <div class="notif-panel-header">
          <span class="notif-panel-title">通知中心</span>
          <button class="notif-panel-mark-all" id="notif-mark-all">全部已读</button>
        </div>
        <div class="notif-panel-body">
          <div class="notif-list" id="notif-list" style="display:none;"></div>
          <div class="notif-empty" id="notif-empty">
            <span class="notif-empty-icon">🔔</span>
            <p>暂无新通知</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 快速录入 FAB 按钮 -->
  <!-- AI + 快速录入 浮动按钮组 -->
  <div class="ai-fab-group" id="ai-fab-group">
    <button class="ai-fab-btn ai-fab-xiaolu" id="ai-fab-xiaolu" title="小鹿AI">🦌</button>
    <button class="ai-fab-btn ai-fab-nicole" id="ai-fab-nicole" title="妮可AI">💎</button>
    <button class="qi-fab" id="qi-fab" title="快速录入 (按 / 键)">⚡</button>
  </div>

  <!-- 休息模式 -->
  <div id="rest-overlay" class="rest-overlay">
    <canvas id="rest-canvas"></canvas>
    <div id="rest-time" class="rest-time"></div>
    <div id="rest-quote" class="rest-quote"></div>
    <div class="rest-hint">轻触屏幕退出</div>
  </div>

  <!-- ES Module 入口：核心依赖静态导入，功能模块按需动态加载 -->
  <script type="module" src="core/app.js?v=75"></script>

</body>
</html>
