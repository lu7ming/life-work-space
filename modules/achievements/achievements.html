<!-- 成就展示面板 -->
<div class="achievements-page">
  <div class="achievements-header">
    <h2 class="achievements-title">🎖️ 成就勋章</h2>
    <div class="achievements-summary">
      <span id="achievements-unlocked-count">0</span> / <span id="achievements-total-count">15</span> 已解锁
    </div>
  </div>

  <!-- 进度总览 -->
  <div class="achievements-progress-bar">
    <div class="achievements-progress-fill" id="achievements-progress-fill" style="width: 0%"></div>
  </div>

  <!-- 分类筛选 -->
  <div class="achievements-filters">
    <button class="achievements-filter-btn active" data-filter="all">全部</button>
    <button class="achievements-filter-btn" data-filter="checkin">打卡</button>
    <button class="achievements-filter-btn" data-filter="journal">记录</button>
    <button class="achievements-filter-btn" data-filter="finance">财务</button>
    <button class="achievements-filter-btn" data-filter="study">学习</button>
    <button class="achievements-filter-btn" data-filter="health">健康</button>
    <button class="achievements-filter-btn" data-filter="content">创作</button>
    <button class="achievements-filter-btn" data-filter="tasks">任务</button>
    <button class="achievements-filter-btn" data-filter="usage">使用</button>
  </div>

  <!-- 成就卡片网格 -->
  <div class="achievements-grid" id="achievements-grid">
    <!-- 动态渲染 -->
  </div>

  <!-- 成就详情弹窗 -->
  <div class="achievement-detail-overlay" id="achievement-detail-overlay">
    <div class="achievement-detail-card" id="achievement-detail-card">
      <button class="achievement-detail-close" id="achievement-detail-close">✕</button>
      <div class="achievement-detail-icon" id="achievement-detail-icon"></div>
      <div class="achievement-detail-name" id="achievement-detail-name"></div>
      <div class="achievement-detail-desc" id="achievement-detail-desc"></div>
      <div class="achievement-detail-status" id="achievement-detail-status"></div>
      <div class="achievement-detail-progress" id="achievement-detail-progress"></div>
      <div class="achievement-detail-date" id="achievement-detail-date"></div>
    </div>
  </div>
</div>
