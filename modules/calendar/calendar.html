<!-- calendar.html - 日历视图模板 -->
<div class="calendar page-enter">

  <!-- 顶部：月份切换 -->
  <div class="calendar-header">
    <h1 class="calendar-title">📅 日历总览</h1>
    <div class="calendar-month-switcher">
      <button class="calendar-month-btn" id="calendar-prev-month" title="上个月">‹</button>
      <span class="calendar-month-label" id="calendar-month-label"></span>
      <button class="calendar-month-btn" id="calendar-next-month" title="下个月">›</button>
      <button class="calendar-today-btn" id="calendar-today-btn">今天</button>
    </div>
  </div>

  <!-- 图例 -->
  <div class="calendar-legend">
    <span class="calendar-legend-item"><span class="calendar-legend-dot" style="background:var(--cal-habits);"></span>打卡</span>
    <span class="calendar-legend-item"><span class="calendar-legend-dot" style="background:var(--cal-tasks);"></span>任务</span>
    <span class="calendar-legend-item"><span class="calendar-legend-dot" style="background:var(--cal-journal);"></span>日记</span>
    <span class="calendar-legend-item"><span class="calendar-legend-dot" style="background:var(--cal-expense);"></span>支出</span>
    <span class="calendar-legend-item"><span class="calendar-legend-dot" style="background:var(--cal-income);"></span>收入</span>
    <span class="calendar-legend-item"><span class="calendar-legend-dot" style="background:var(--cal-health);"></span>健康</span>
    <span class="calendar-legend-item"><span class="calendar-legend-dot" style="background:var(--cal-study);"></span>学习</span>
  </div>

  <!-- 月历网格 -->
  <div class="calendar-grid-wrapper">
    <div class="calendar-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="calendar-days" id="calendar-days">
      <!-- JS 动态渲染 -->
    </div>
  </div>

  <!-- 日期详情面板（底部滑入） -->
  <div class="calendar-detail-overlay" id="calendar-detail-overlay"></div>
  <div class="calendar-detail-panel" id="calendar-detail-panel">
    <div class="calendar-detail-header">
      <span class="calendar-detail-date" id="calendar-detail-date"></span>
      <button class="calendar-detail-close" id="calendar-detail-close">✕</button>
    </div>
    <div class="calendar-detail-body" id="calendar-detail-body">
      <!-- JS 动态渲染 -->
    </div>
  </div>

</div>
