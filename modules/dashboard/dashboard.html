<!-- dashboard.html - 总面板模板 -->
<div class="dashboard page-enter">
  <!-- 问候区域 -->
  <div class="dash-greeting">
    <h1 class="dash-greeting-title" id="dash-greeting-text">下午好，鹿7铭。</h1>
    <p class="dash-greeting-subtitle" id="dash-greeting-sub"></p>
  </div>

  <!-- 生日提醒区域 -->
  <div id="dash-birthday-reminder" style="display:none;"></div>

  <!-- 月末复盘提醒 -->
  <div class="dash-template-reminder hidden" id="dash-template-reminder">
    <div class="dash-template-reminder-left">
      <span class="dash-template-reminder-icon">📊</span>
      <div class="dash-template-reminder-text">
        <h3>该做月度复盘啦！</h3>
        <p>回顾这个月的收获，为下月做好规划</p>
      </div>
    </div>
    <span class="dash-template-reminder-arrow">›</span>
  </div>

  <!-- 智能聚焦卡片 - 根据时段自动切换内容 -->
  <div class="dash-smart-focus card" id="dash-smart-focus" style="display:none;">
    <!-- JS 动态渲染 -->
  </div>

  <!-- F1: 今日聚焦卡片 -->
  <div class="dash-focus-card card" id="dash-focus-card">
    <div class="dash-focus-header">
      <h3 class="dash-focus-title">🎯 今日聚焦</h3>
      <div class="dash-focus-actions">
        <button class="dash-focus-btn" id="dash-focus-customize" title="自定义今日三件事">✏️ 自定义</button>
        <button class="dash-focus-btn" id="dash-focus-refresh" title="换一批">🔄 换一批</button>
      </div>
    </div>
    <div class="dash-focus-list" id="dash-focus-list">
      <!-- JS 动态生成 -->
    </div>
  </div>

  <!-- 妮可洞察区域 -->
  <div class="dashboard-nicole-insight" id="dashboard-nicole-insight" style="display:none;">
    <div class="nicole-insight-header">
      <span class="nicole-insight-icon">🔵</span>
      <span class="nicole-insight-title">妮可洞察</span>
    </div>
    <div class="nicole-insight-body" id="dashboard-nicole-insight-body">正在分析中...</div>
  </div>

  <!-- 智能建议区域 -->
  <div class="dash-smart-suggestions card" id="dash-smart-suggestions" style="display:none;">
    <!-- JS 动态渲染 -->
  </div>

  <!-- 「猜你想做」预测操作区域 -->
  <div class="dash-predictive-actions card" id="dash-predictive-actions" style="display:none;">
    <!-- JS 动态渲染 -->
  </div>

  <!-- 两列布局 -->
  <div class="dash-grid">
    <!-- 左列：日历 -->
    <div class="dash-calendar card">
      <div class="dash-calendar-header">
        <span class="dash-calendar-title" id="dash-calendar-month"></span>
      </div>
      <div class="dash-calendar-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span>
        <span>四</span><span>五</span><span>六</span>
      </div>
      <div class="dash-calendar-days" id="dash-calendar-days">
        <!-- JS 动态生成 -->
      </div>
    </div>

    <!-- 右列：亮点卡片 -->
    <div class="dash-highlights">
      <div class="dash-highlight-card card" style="--accent: var(--accent-green); --accent-light: var(--accent-green-light);">
        <span class="dash-highlight-icon">📅</span>
        <div class="dash-highlight-info">
          <span class="dash-highlight-value" id="dash-checkin-count">0</span>
          <span class="dash-highlight-label">已签到天数</span>
        </div>
      </div>
      <div class="dash-highlight-card card" style="--accent: var(--accent-blue); --accent-light: var(--accent-blue-light);">
        <span class="dash-highlight-icon">📖</span>
        <div class="dash-highlight-info">
          <span class="dash-highlight-value" id="dash-study-hours">0h</span>
          <span class="dash-highlight-label">学习时长</span>
        </div>
      </div>
      <div class="dash-highlight-card card" style="--accent: var(--accent-orange); --accent-light: var(--accent-orange-light);">
        <span class="dash-highlight-icon">💰</span>
        <div class="dash-highlight-info">
          <span class="dash-highlight-value" id="dash-month-expense">¥0</span>
          <span class="dash-highlight-label">本月支出</span>
        </div>
      </div>
      <div class="dash-highlight-card card" style="--accent: var(--accent-purple); --accent-light: var(--accent-purple-light);">
        <span class="dash-highlight-icon">💎</span>
        <div class="dash-highlight-info">
          <span class="dash-highlight-value" id="dash-month-balance">¥0</span>
          <span class="dash-highlight-label">本月结余</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 今日推送 -->
  <div class="dash-feed card">
    <h3 class="dash-feed-title">📰 今日动态</h3>
    <div class="dash-feed-list" id="dash-feed-list">
      <!-- JS 动态生成 -->
    </div>
  </div>

  <!-- ===== 数据看板2.0 - Widget系统 ===== -->
  <div class="dash-widget-section" id="dash-widget-section">
    <div class="dash-widget-header">
      <h3 class="dash-widget-title">📊 数据看板</h3>
      <div class="dash-widget-actions">
        <button class="dash-widget-btn" id="dash-widget-edit-btn" title="编辑首页">✏️ 编辑首页</button>
      </div>
    </div>
    <div class="dash-widget-grid" id="dash-widget-grid">
      <!-- JS 动态渲染 Widget -->
    </div>
  </div>

  <!-- F5: 年度回顾入口 -->
  <div class="dash-annual-entry">
    <button class="dash-annual-btn" id="dash-annual-btn">📊 年度回顾</button>
  </div>

  <!-- F1: 自定义今日三件事弹窗 -->
  <div class="dash-modal-overlay" id="dash-custom-focus-overlay" style="display:none;">
    <div class="dash-modal card">
      <div class="dash-modal-header">
        <h3>选择今日聚焦</h3>
        <button class="dash-modal-close" id="dash-custom-focus-close">✕</button>
      </div>
      <div class="dash-modal-body">
        <p class="dash-modal-tip">选择最多3个任务作为今日聚焦</p>
        <div class="dash-modal-task-list" id="dash-custom-task-list">
          <!-- JS 动态生成 -->
        </div>
      </div>
      <div class="dash-modal-footer">
        <button class="dash-modal-confirm" id="dash-custom-focus-confirm">确认</button>
      </div>
    </div>
  </div>

  <!-- F5: 年度回顾弹窗 -->
  <div class="dash-modal-overlay" id="dash-annual-overlay" style="display:none;">
    <div class="dash-modal dash-modal-wide card">
      <div class="dash-modal-header">
        <h3>📊 <span id="dash-annual-year"></span> 年度回顾</h3>
        <button class="dash-modal-close" id="dash-annual-close">✕</button>
      </div>
      <div class="dash-modal-body" id="dash-annual-body">
        <!-- JS 动态生成 -->
      </div>
    </div>
  </div>

  <!-- ===== Widget配置弹窗 ===== -->
  <div class="dash-modal-overlay" id="dash-widget-config-overlay" style="display:none;">
    <div class="dash-modal dash-modal-wide card">
      <div class="dash-modal-header">
        <h3>✏️ 编辑数据看板</h3>
        <button class="dash-modal-close" id="dash-widget-config-close">✕</button>
      </div>
      <div class="dash-modal-body">
        <!-- 预设布局方案 -->
        <div class="dash-widget-preset-section">
          <p class="dash-modal-tip">选择预设布局方案，或自定义 Widget</p>
          <div class="dash-widget-preset-list" id="dash-widget-preset-list">
            <button class="dash-widget-preset-btn" data-preset="simple">🌿 简洁</button>
            <button class="dash-widget-preset-btn" data-preset="rich">✨ 丰富</button>
            <button class="dash-widget-preset-btn" data-preset="data">📈 数据控</button>
          </div>
        </div>
        <!-- 当前Widget列表（可拖拽排序、删除） -->
        <div class="dash-widget-config-list" id="dash-widget-config-list">
          <!-- JS 动态生成 -->
        </div>
        <!-- 添加Widget -->
        <div class="dash-widget-add-section">
          <button class="dash-widget-add-btn" id="dash-widget-add-btn">➕ 添加 Widget</button>
          <div class="dash-widget-type-menu hidden" id="dash-widget-type-menu">
            <button class="dash-widget-type-item" data-type="progress-ring">⭕ 进度环</button>
            <button class="dash-widget-type-item" data-type="mini-line-chart">📈 迷你折线图</button>
            <button class="dash-widget-type-item" data-type="counter">🔢 计数器</button>
            <button class="dash-widget-type-item" data-type="list-widget">📋 列表</button>
            <button class="dash-widget-type-item" data-type="chart-widget">🥧 饼图</button>
          </div>
        </div>
      </div>
      <div class="dash-modal-footer">
        <button class="dash-modal-confirm" id="dash-widget-config-confirm">完成</button>
      </div>
    </div>
  </div>
</div>
