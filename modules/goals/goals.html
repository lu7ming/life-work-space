<!--
  goals.html - 目标管理模块
  人生工作台 · 月度/季度/年度目标追踪
-->
<div class="module-container page-enter goals">

  <!-- 顶部 -->
  <div class="module-header goals-header">
    <h1 class="module-title goals-title">目标管理</h1>
    <div class="module-actions goals-actions">
      <!-- 视图切换 -->
      <div class="goals-view-toggle">
        <button class="goals-view-btn active" data-view="list" title="列表视图">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="2.5" rx="1" fill="currentColor"/><rect x="1" y="6.75" width="14" height="2.5" rx="1" fill="currentColor"/><rect x="1" y="11.5" width="14" height="2.5" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="goals-view-btn" data-view="kanban" title="看板视图">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1" fill="currentColor"/><rect x="6" y="1" width="4" height="9" rx="1" fill="currentColor"/><rect x="11" y="1" width="4" height="11" rx="1" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 层级筛选 Tab -->
  <div class="goals-tabs">
    <button class="goals-tab active" data-level="all">全部</button>
    <button class="goals-tab" data-level="yearly">年度</button>
    <button class="goals-tab" data-level="quarterly">季度</button>
    <button class="goals-tab" data-level="monthly">月度</button>
  </div>

  <!-- 统计卡片 -->
  <div class="goals-stats" id="goalsStats"></div>

  <!-- 列表视图 -->
  <div class="goals-list-view" id="goalsListView"></div>

  <!-- 看板视图 -->
  <div class="goals-kanban-view" id="goalsKanbanView" style="display:none;"></div>

  <!-- 空状态 -->
  <div class="goals-empty" id="goalsEmpty" style="display:none;">
    <div class="goals-empty-icon">🎯</div>
    <p class="goals-empty-text">还没有目标</p>
    <p class="goals-empty-hint">点击右下角按钮创建你的第一个目标</p>
  </div>

  <!-- FAB -->
  <button class="module-fab goals-fab" id="goalsFab" title="新建目标">＋</button>

  <!-- 新建/编辑弹窗 -->
  <div class="goals-modal-overlay" id="goalsModalOverlay" style="display:none;">
    <div class="goals-modal">
      <div class="goals-modal-header">
        <h2 class="goals-modal-title" id="goalsModalTitle">新建目标</h2>
        <button class="goals-modal-close" id="goalsModalClose">✕</button>
      </div>
      <form class="goals-form" id="goalsForm">
        <input type="hidden" id="goalEditId" value="">
        <div class="goals-field">
          <label class="goals-label">目标标题 *</label>
          <input type="text" class="goals-input" id="goalTitle" placeholder="例如：读完12本书" required maxlength="100">
        </div>
        <div class="goals-field">
          <label class="goals-label">描述</label>
          <textarea class="goals-input goals-textarea" id="goalDesc" placeholder="目标的详细描述..." rows="3" maxlength="500"></textarea>
        </div>
        <div class="goals-row">
          <div class="goals-field goals-field-half">
            <label class="goals-label">层级 *</label>
            <select class="goals-input goals-select" id="goalLevel" required>
              <option value="monthly">月度</option>
              <option value="quarterly">季度</option>
              <option value="yearly">年度</option>
            </select>
          </div>
          <div class="goals-field goals-field-half">
            <label class="goals-label">截止日期 *</label>
            <input type="date" class="goals-input" id="goalDeadline" required>
          </div>
        </div>
        <div class="goals-row">
          <div class="goals-field goals-field-half">
            <label class="goals-label">状态</label>
            <select class="goals-input goals-select" id="goalStatus">
              <option value="active">进行中</option>
              <option value="completed">已完成</option>
              <option value="abandoned">已放弃</option>
            </select>
          </div>
          <div class="goals-field goals-field-half">
            <label class="goals-label">进度 (%)</label>
            <div class="goals-progress-input-wrap">
              <input type="number" class="goals-input" id="goalProgress" min="0" max="100" value="0" placeholder="自动">
              <label class="goals-manual-toggle">
                <input type="checkbox" id="goalManualProgress"> <span>手动</span>
              </label>
            </div>
          </div>
        </div>
        <div class="goals-field">
          <label class="goals-label">关联任务 ID（逗号分隔，可选）</label>
          <input type="text" class="goals-input" id="goalRelatedTasks" placeholder="例如：1,3,5">
        </div>
        <div class="goals-form-actions">
          <button type="button" class="goals-btn goals-btn-ghost" id="goalsBtnCancel">取消</button>
          <button type="button" class="goals-btn goals-btn-danger" id="goalsBtnDelete" style="display:none;">删除</button>
          <button type="submit" class="goals-btn goals-btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

</div>
