<!-- habits.html - 习惯打卡模板 -->
<div class="habits page-enter">

  <!-- 顶部：日期切换 -->
  <div class="habits-header">
    <h1 class="habits-title">✅ 习惯打卡</h1>
    <div class="habits-date-switcher">
      <button class="habits-date-btn" id="habits-prev-day" title="前一天">‹</button>
      <div class="habits-date-display">
        <span class="habits-date-text" id="habits-date-text"></span>
        <span class="habits-date-weekday" id="habits-date-weekday"></span>
      </div>
      <button class="habits-date-btn" id="habits-next-day" title="后一天">›</button>
      <button class="habits-today-btn" id="habits-today-btn">今天</button>
      <button class="habits-retroactive-btn" id="habits-retroactive-btn" title="补签">
        <span class="habits-retroactive-icon">📅</span>
        <span class="habits-retroactive-text">补签</span>
        <span class="habits-retroactive-count" id="habits-retroactive-count"></span>
      </button>
    </div>
  </div>

  <!-- 主区域：两列布局 -->
  <div class="habits-body">

    <!-- 左列：习惯卡片网格 -->
    <div class="habits-main">

      <!-- 习惯组合：快捷打卡 -->
      <div class="habits-groups" id="habits-groups">
        <div class="habits-groups-title">⚡ 快捷打卡</div>
        <div class="habits-groups-list" id="habits-groups-list">
          <!-- JS 动态生成 3 个组合按钮 -->
        </div>
      </div>

      <!-- 习惯链：顺序引导 -->
      <div class="habits-chains" id="habits-chains">
        <div class="habits-chains-title">🔗 习惯链</div>
        <div class="habits-chains-list" id="habits-chains-list">
          <!-- JS 动态生成 3 条链 -->
        </div>
      </div>

      <!-- 习惯卡片网格 -->
      <div class="habits-grid" id="habits-grid">
        <!-- JS 动态生成 12 个习惯卡片 -->
      </div>

      <!-- 底部：完成进度 -->
      <div class="habits-progress card">
        <div class="habits-progress-header">
          <span class="habits-progress-label">今日完成</span>
          <span class="habits-progress-count" id="habits-progress-count">0/12</span>
        </div>
        <div class="habits-progress-bar">
          <div class="habits-progress-fill" id="habits-progress-fill"></div>
        </div>
        <p class="habits-progress-motivation" id="habits-progress-motivation"></p>
      </div>
    </div>

    <!-- 右列：打卡日历 -->
    <div class="habits-calendar card">
      <div class="habits-calendar-header">
        <button class="habits-calendar-nav" id="habits-prev-month">‹</button>
        <span class="habits-calendar-title" id="habits-calendar-title"></span>
        <button class="habits-calendar-nav" id="habits-next-month">›</button>
      </div>
      <div class="habits-calendar-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span>
        <span>四</span><span>五</span><span>六</span>
      </div>
      <div class="habits-calendar-days" id="habits-calendar-days">
        <!-- JS 动态生成 -->
      </div>
      <div class="habits-calendar-legend">
        <span class="habits-legend-item"><i class="habits-legend-dot" style="background:var(--accent-green)"></i>有打卡</span>
        <span class="habits-legend-item"><i class="habits-legend-dot" style="background:var(--accent-orange)"></i>全部完成</span>
        <span class="habits-legend-item"><i class="habits-legend-dot habits-legend-dot--today"></i>今天</span>
      </div>
    </div>

  </div>

  <!-- 补签日历弹窗 -->
  <div class="habits-retroactive-overlay" id="habits-retroactive-overlay">
    <div class="habits-retroactive-dialog">
      <div class="habits-retroactive-header">
        <h2 class="habits-retroactive-title">📅 补签日历</h2>
        <button class="habits-retroactive-close" id="habits-retroactive-close">✕</button>
      </div>
      <div class="habits-retroactive-info" id="habits-retroactive-info">
        本月还剩 <strong>3</strong> 次补签机会
      </div>
      <div class="habits-retroactive-calendar">
        <div class="habits-retroactive-calendar-header">
          <button class="habits-retroactive-cal-nav" id="retroactive-prev-month">‹</button>
          <span class="habits-retroactive-cal-title" id="retroactive-cal-title"></span>
          <button class="habits-retroactive-cal-nav" id="retroactive-next-month">›</button>
        </div>
        <div class="habits-retroactive-calendar-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span>
          <span>四</span><span>五</span><span>六</span>
        </div>
        <div class="habits-retroactive-calendar-days" id="retroactive-calendar-days">
        </div>
      </div>
      <div class="habits-retroactive-legend">
        <span class="habits-legend-item"><i class="habits-legend-dot" style="background:var(--accent-green)"></i>已打卡</span>
        <span class="habits-legend-item"><i class="habits-legend-dot" style="background:var(--text-light)"></i>未打卡</span>
        <span class="habits-legend-item"><i class="habits-legend-dot habits-legend-dot--today"></i>今天</span>
      </div>
    </div>
  </div>

  <!-- 补签确认弹窗 -->
  <div class="habits-retroactive-confirm-overlay" id="habits-retroactive-confirm-overlay">
    <div class="habits-retroactive-confirm-dialog">
      <div class="habits-retroactive-confirm-header">
        <h2 class="habits-retroactive-confirm-title" id="retroactive-confirm-title">补签 · YYYY-MM-DD</h2>
        <button class="habits-retroactive-close" id="habits-retroactive-confirm-close">✕</button>
      </div>
      <div class="habits-retroactive-confirm-list" id="retroactive-confirm-list">
        <!-- JS 动态生成习惯勾选列表 -->
      </div>
      <div class="habits-retroactive-confirm-footer">
        <button class="habits-retroactive-cancel-btn" id="retroactive-cancel-btn">取消</button>
        <button class="habits-retroactive-ok-btn" id="retroactive-ok-btn">确认补签</button>
      </div>
    </div>
  </div>
</div>
