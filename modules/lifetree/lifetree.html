<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生命树 - 人生工作台</title>
</head>
<body>
  <div class="module-container page-enter">
    <!-- 顶部标题 -->
    <div class="module-header">
      <h1 class="module-title">🌳 我的生命树</h1>
      <div class="module-actions">
        <span class="season-badge" id="seasonBadge">🌱 春</span>
        <span class="weather-badge" id="weatherBadge">☀️ 晴天</span>
      </div>
    </div>

    <!-- 主内容区 -->
    <div class="lifetree-main">
      <!-- 左侧 SVG 树区域 -->
      <div class="svg-wrapper" id="svgWrapper">
        <!-- SVG 由 JS 动态生成 -->
        <div class="tree-bottom-info" id="treeBottomInfo">
          <!-- 6维度小标签由 JS 动态填充 -->
        </div>
      </div>

      <!-- 右侧面板 -->
      <div class="detail-panel">
        <!-- 土壤状态 -->
        <div class="panel-section">
          <h3 class="panel-section-title">🌍 土壤状态</h3>
          <div class="soil-grid" id="soilGrid">
            <!-- JS 填充 -->
          </div>
        </div>

        <!-- 六大维度 -->
        <div class="panel-section">
          <h3 class="panel-section-title">🌿 生命维度</h3>
          <div class="dimension-list" id="dimensionList">
            <!-- JS 填充 -->
          </div>
        </div>

        <!-- 近期数据 -->
        <div class="panel-section">
          <h3 class="panel-section-title">📊 近期状态</h3>
          <div class="stats-row" id="statsRow">
            <!-- JS 填充 -->
          </div>
        </div>
      </div>
    </div>

    <!-- 底部季节信息 -->
    <div class="lifetree-footer">
      <span id="footerInfo">用每一天的行动，滋养你的生命之树 🌱</span>
    </div>
  </div>
</body>
</html>
