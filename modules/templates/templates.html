<!-- templates.html - 模板系统页面 -->
<div class="templates-page page-enter" id="templates-page">
  <!-- 主列表视图 -->
  <div id="templates-list-view">
    <!-- 页面标题 -->
    <div class="templates-header">
      <div class="templates-header-left">
        <h2>📊 月度复盘模板</h2>
        <p>选择模板，回顾并总结每个月的成长</p>
      </div>
      <div class="templates-month-picker">
        <button id="tpl-prev-month" title="上个月">◀</button>
        <span id="tpl-current-month"></span>
        <button id="tpl-next-month" title="下个月">▶</button>
      </div>
    </div>

    <!-- 月末提醒卡片 -->
    <div class="templates-reminder-card hidden" id="tpl-reminder-card">
      <div class="templates-reminder-left">
        <span class="templates-reminder-icon">🌟</span>
        <div class="templates-reminder-text">
          <h3>本月即将结束</h3>
          <p>是时候做一次月度复盘，回顾收获与成长了！</p>
        </div>
      </div>
      <button class="templates-reminder-btn" id="tpl-start-summary">开始总结</button>
    </div>

    <!-- 模板卡片网格 -->
    <div class="templates-grid" id="templates-grid">
      <!-- JS 动态生成 -->
    </div>

    <!-- 历史报告 -->
    <div class="report-history-section" id="tpl-history-section">
      <h3 class="report-history-title">📁 历史报告</h3>
      <div class="report-history-list" id="tpl-history-list">
        <!-- JS 动态生成 -->
      </div>
    </div>
  </div>

  <!-- 报告详情视图 -->
  <div class="report-detail" id="templates-detail-view">
    <div class="report-detail-header">
      <button class="report-back-btn" id="tpl-back-btn">
        ← 返回列表
      </button>
      <div class="report-actions">
        <button class="report-action-btn" id="tpl-export-md" title="导出 Markdown">📄 Markdown</button>
        <button class="report-action-btn" id="tpl-export-json" title="导出 JSON">📋 JSON</button>
        <button class="report-action-btn primary" id="tpl-save-report" title="保存报告">💾 保存</button>
      </div>
    </div>

    <!-- 报告内容区 -->
    <div id="tpl-report-content">
      <!-- JS 动态生成 -->
    </div>
  </div>
</div>
