<div class="timetracker-page">
  <div class="timetracker-header">
    <h2 class="timetracker-title">⏱️ 时间追踪</h2>
    <p class="timetracker-subtitle">了解你的时间去向</p>
  </div>

  <div class="timetracker-actions">
    <button class="tt-btn tt-btn-primary" id="tt-start-btn">▶ 开始追踪</button>
    <button class="tt-btn tt-btn-secondary" id="tt-manual-btn">✏️ 手动记录</button>
  </div>

  <!-- 正在追踪 -->
  <div class="tt-active-card" id="tt-active-card" style="display:none;">
    <div class="tt-active-header">
      <span class="tt-active-dot"></span>
      <span class="tt-active-label">正在追踪</span>
      <button class="tt-btn-sm tt-stop-btn" id="tt-stop-btn">⏹ 停止</button>
    </div>
    <div class="tt-active-info">
      <span class="tt-active-category" id="tt-active-category">--</span>
      <span class="tt-active-elapsed" id="tt-active-elapsed">00:00:00</span>
    </div>
    <input class="tt-active-note" id="tt-active-note" placeholder="备注（可选）" />
  </div>

  <!-- 时间分布饼图 -->
  <div class="tt-card">
    <h3 class="tt-card-title">📊 今日时间分布</h3>
    <div class="tt-chart-area" id="tt-chart-area">
      <div class="tt-empty-state">暂无今日数据，开始追踪吧</div>
    </div>
    <div class="tt-legend" id="tt-legend"></div>
  </div>

  <!-- 时间线 -->
  <div class="tt-card">
    <h3 class="tt-card-title">📅 今日时间线</h3>
    <div class="tt-timeline" id="tt-timeline">
      <div class="tt-empty-state">今天还没有记录</div>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="tt-card">
    <h3 class="tt-card-title">📋 最近记录</h3>
    <div class="tt-records" id="tt-records">
      <div class="tt-empty-state">暂无记录</div>
    </div>
  </div>

  <!-- 分类选择弹窗 -->
  <div class="tt-modal-overlay" id="tt-category-modal" style="display:none;">
    <div class="tt-modal">
      <div class="tt-modal-header">
        <h3>▶ 选择追踪分类</h3>
        <button class="tt-modal-close" id="tt-cat-close">✕</button>
      </div>
      <div class="tt-modal-body">
        <div class="tt-cat-grid" id="tt-cat-grid">
          <button class="tt-cat-btn" data-cat="work">💼 工作</button>
          <button class="tt-cat-btn" data-cat="study">📚 学习</button>
          <button class="tt-cat-btn" data-cat="exercise">💪 运动</button>
          <button class="tt-cat-btn" data-cat="leisure">🎮 娱乐</button>
          <button class="tt-cat-btn" data-cat="rest">😴 休息</button>
          <button class="tt-cat-btn" data-cat="other">📌 其他</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 手动记录弹窗 -->
  <div class="tt-modal-overlay" id="tt-manual-modal" style="display:none;">
    <div class="tt-modal">
      <div class="tt-modal-header">
        <h3>✏️ 手动记录时间</h3>
        <button class="tt-modal-close" id="tt-manual-close">✕</button>
      </div>
      <div class="tt-modal-body">
        <div class="tt-form-group">
          <label>分类</label>
          <select id="tt-form-category">
            <option value="work">💼 工作</option>
            <option value="study">📚 学习</option>
            <option value="exercise">💪 运动</option>
            <option value="leisure">🎮 娱乐</option>
            <option value="rest">😴 休息</option>
            <option value="other">📌 其他</option>
          </select>
        </div>
        <div class="tt-form-group">
          <label>开始时间</label>
          <input type="time" id="tt-form-start" />
        </div>
        <div class="tt-form-group">
          <label>结束时间</label>
          <input type="time" id="tt-form-end" />
        </div>
        <div class="tt-form-group">
          <label>备注</label>
          <input type="text" id="tt-form-note" placeholder="可选备注" />
        </div>
      </div>
      <div class="tt-modal-footer">
        <button class="tt-btn tt-btn-secondary" id="tt-manual-cancel">取消</button>
        <button class="tt-btn tt-btn-primary" id="tt-manual-confirm">确认</button>
      </div>
    </div>
  </div>
</div>
