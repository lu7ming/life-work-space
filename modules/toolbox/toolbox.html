<!-- toolbox.html - 网址工具箱模板 -->
<div class="toolbox page-enter">

  <!-- 顶部标题栏 -->
  <div class="toolbox-header">
    <h1 class="toolbox-title">🧰 网址工具箱</h1>
    <div class="toolbox-actions">
      <button class="toolbox-btn toolbox-btn-primary" id="toolbox-add-btn">+ 添加网址</button>
    </div>
  </div>

  <!-- 搜索/筛选栏 -->
  <div class="toolbox-toolbar">
    <div class="toolbox-search">
      <span class="toolbox-search-icon">🔍</span>
      <input type="text" id="toolbox-search-input" placeholder="搜索网址名称..." autocomplete="off">
    </div>
    <div class="toolbox-filters" id="toolbox-filters">
      <!-- JS 动态生成分类标签 -->
    </div>
  </div>

  <!-- 网址分类列表 -->
  <div id="toolbox-categories">
    <!-- JS 动态生成 -->
  </div>

  <!-- 添加/编辑弹窗 -->
  <div class="toolbox-modal-overlay" id="toolbox-form-overlay">
    <div class="toolbox-modal">
      <div class="toolbox-modal-header">
        <span class="toolbox-modal-title" id="toolbox-form-title">添加网址</span>
        <button class="toolbox-modal-close" id="toolbox-form-close">✕</button>
      </div>
      <form id="toolbox-form" autocomplete="off">
        <div class="toolbox-form-group">
          <label class="toolbox-form-label">名称</label>
          <input class="toolbox-form-input" type="text" id="toolbox-form-name" placeholder="如：ChatGPT" required>
        </div>
        <div class="toolbox-form-group">
          <label class="toolbox-form-label">网址</label>
          <input class="toolbox-form-input" type="url" id="toolbox-form-url" placeholder="https://..." required>
        </div>
        <div class="toolbox-form-group">
          <label class="toolbox-form-label">分类</label>
          <select class="toolbox-form-select" id="toolbox-form-category" required>
            <!-- JS 动态生成选项 -->
          </select>
        </div>
        <div class="toolbox-form-group">
          <label class="toolbox-form-label">图标</label>
          <div class="toolbox-icon-picker" id="toolbox-icon-picker">
            <!-- JS 动态生成图标选项 -->
          </div>
        </div>
        <input type="hidden" id="toolbox-form-id">
        <input type="hidden" id="toolbox-form-icon">
        <div class="toolbox-modal-footer">
          <button type="button" class="toolbox-btn toolbox-btn-ghost" id="toolbox-form-cancel">取消</button>
          <button type="submit" class="toolbox-btn toolbox-btn-primary" id="toolbox-form-submit">添加</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="toolbox-modal-overlay" id="toolbox-delete-overlay">
    <div class="toolbox-modal">
      <div class="toolbox-modal-header">
        <span class="toolbox-modal-title">确认删除</span>
        <button class="toolbox-modal-close" id="toolbox-delete-close">✕</button>
      </div>
      <p class="toolbox-confirm-text">
        确定要删除 <span class="toolbox-confirm-name" id="toolbox-delete-name"></span> 吗？此操作不可撤销。
      </p>
      <div class="toolbox-modal-footer">
        <button class="toolbox-btn toolbox-btn-ghost" id="toolbox-delete-cancel">取消</button>
        <button class="toolbox-btn toolbox-btn-primary" id="toolbox-delete-confirm" style="background:var(--accent-red);">删除</button>
      </div>
    </div>
  </div>

</div>
