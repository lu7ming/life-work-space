<!--
  travel.html - 旅行计划模块
  人生工作台 · 目的地管理 · 旅行基金 · 证件清单 · 费用拆解 · 时间线倒计时
-->
<div class="module-container page-enter travel">

  <!-- 顶部标题 -->
  <div class="module-header travel-header">
    <h1 class="module-title travel-title">旅行计划</h1>
    <div class="module-actions travel-actions">
    </div>
  </div>

  <!-- 基金总览大卡 -->
  <div class="travel-fund-hero card">
    <div class="travel-fund-label">旅行基金总览</div>
    <div class="travel-fund-amounts">
      <span class="travel-fund-current" id="travelTotalSaved">¥0</span>
      <span class="travel-fund-target" id="travelTotalTarget">/ ¥0 目标</span>
    </div>
    <div class="travel-fund-progress-wrap">
      <div class="travel-fund-progress-bar">
        <div class="travel-fund-progress-fill" id="travelFundBar" style="width:0%;"></div>
      </div>
      <div class="travel-fund-progress-info">
        <span id="travelFundPercent">0%</span>
        <span id="travelFundRemain">剩余 ¥0</span>
      </div>
    </div>
  </div>

  <!-- 统计小卡片行 -->
  <div class="travel-stat-row">
    <div class="travel-stat-card card">
      <div class="travel-stat-icon">🌍</div>
      <div class="travel-stat-value" id="travelDestCount">0</div>
      <div class="travel-stat-label">目的地</div>
    </div>
    <div class="travel-stat-card card">
      <div class="travel-stat-icon">✈️</div>
      <div class="travel-stat-value" id="travelPrepCount">0</div>
      <div class="travel-stat-label">准备中</div>
    </div>
    <div class="travel-stat-card card">
      <div class="travel-stat-icon">🏝️</div>
      <div class="travel-stat-value" id="travelDoneCount">0</div>
      <div class="travel-stat-label">已去过</div>
    </div>
  </div>

  <!-- 最近旅行倒计时 -->
  <div class="travel-countdown-card card" id="travelCountdownCard" style="display:none;">
    <div class="travel-countdown-flag" id="travelCountdownFlag">✈️</div>
    <div class="travel-countdown-text">
      <div class="travel-countdown-label">最近一次旅行</div>
      <div class="travel-countdown-name" id="travelCountdownName">—</div>
    </div>
    <div class="travel-countdown-days">
      <div class="travel-countdown-num" id="travelCountdownNum">0</div>
      <div class="travel-countdown-unit">天后出发</div>
    </div>
  </div>

  <!-- 目的地清单标题 -->
  <div class="travel-section-title">目的地清单</div>

  <!-- 目的地列表 -->
  <div class="travel-destinations" id="travelDestinations"></div>

  <!-- 空状态 -->
  <div class="travel-empty" id="travelEmpty" style="display:none;">
    <div class="travel-empty-icon">✈️</div>
    <p class="travel-empty-text">还没有旅行计划</p>
    <p class="travel-empty-hint">点击右下角按钮添加你的第一个目的地</p>
  </div>

  <!-- FAB -->
  <button class="module-fab travel-fab" id="travelFab" title="添加目的地">＋</button>

  <!-- 添加/编辑弹窗 -->
  <div class="travel-modal-overlay" id="travelModalOverlay" style="display:none;">
    <div class="travel-modal">
      <div class="travel-modal-header">
        <h2 class="travel-modal-title" id="travelModalTitle">添加目的地</h2>
        <button class="travel-modal-close" id="travelModalClose">✕</button>
      </div>
      <form class="travel-form" id="travelForm">
        <input type="hidden" id="travelEditId" value="">
        <div class="travel-field">
          <label class="travel-label">目的地名称 *</label>
          <input type="text" class="travel-input" id="travelName" placeholder="例如：冰岛" required maxlength="50">
        </div>
        <div class="travel-row">
          <div class="travel-field travel-field-half">
            <label class="travel-label">旗帜/Emoji</label>
            <input type="text" class="travel-input" id="travelFlag" placeholder="🇮🇸" maxlength="10">
          </div>
          <div class="travel-field travel-field-half">
            <label class="travel-label">副标题</label>
            <input type="text" class="travel-input" id="travelSubtitle" placeholder="极光 · 蓝湖 · 冰川" maxlength="50">
          </div>
        </div>
        <div class="travel-row">
          <div class="travel-field travel-field-half">
            <label class="travel-label">阶段</label>
            <select class="travel-input travel-select" id="travelStage">
              <option value="want">想去</option>
              <option value="prep">准备中</option>
              <option value="done">已去</option>
            </select>
          </div>
          <div class="travel-field travel-field-half">
            <label class="travel-label">出发日期</label>
            <input type="date" class="travel-input" id="travelDeparture">
          </div>
        </div>
        <div class="travel-row">
          <div class="travel-field travel-field-half">
            <label class="travel-label">基金目标 (¥)</label>
            <input type="number" class="travel-input" id="travelFundTarget" placeholder="30000" min="0">
          </div>
          <div class="travel-field travel-field-half">
            <label class="travel-label">已存金额 (¥)</label>
            <input type="number" class="travel-input" id="travelFundSaved" placeholder="0" min="0">
          </div>
        </div>
        <div class="travel-form-actions">
          <button type="button" class="travel-btn travel-btn-ghost" id="travelBtnCancel">取消</button>
          <button type="button" class="travel-btn travel-btn-danger" id="travelBtnDelete" style="display:none;">删除</button>
          <button type="submit" class="travel-btn travel-btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 存入基金弹窗 -->
  <div class="travel-modal-overlay" id="travelDepositOverlay" style="display:none;">
    <div class="travel-modal travel-modal-sm">
      <div class="travel-modal-header">
        <h2 class="travel-modal-title">存入旅行基金</h2>
        <button class="travel-modal-close" id="travelDepositClose">✕</button>
      </div>
      <div class="travel-form" style="padding:20px 24px 24px;">
        <p class="travel-deposit-target" id="travelDepositTargetName"></p>
        <div class="travel-deposit-input-row">
          <input type="number" class="travel-input" id="travelDepositInput" placeholder="例如 1000" min="1">
          <button class="travel-btn travel-btn-primary" id="travelDepositConfirm">确认存入</button>
        </div>
      </div>
    </div>
  </div>

</div>
